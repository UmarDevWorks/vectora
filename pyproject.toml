[project]
name = "vectora"
version = "0.0.1"
description = "Open-source retrieval infrastructure for AI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "httpx>=0.28.0",
    "trafilatura>=1.8.0",
    "nest-asyncio>=1.6.0"
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "pytest>=8.0.0"
]
web = [
    "flask>=3.0.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"